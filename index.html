<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#161a2b; --muted:#5b6382; --border:#e2e6f0; --accent:#5146e5; --bad:#c2372f; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1220; --card:#171b2e; --text:#e8eaf6; --muted:#9aa1c0; --border:#2a3050; --accent:#8b80ff; --bad:#ff8a80; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text); font:16px/1.55 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  .box { width:100%; max-width:400px; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:30px 26px; box-shadow:0 12px 40px rgba(0,0,0,.08); }
  .mark { width:48px; height:48px; border-radius:14px; background:linear-gradient(135deg,#5146e5,#a74fe0); color:#fff; display:grid; place-items:center; font:700 1.4rem Georgia, serif; margin-bottom:16px; }
  h1 { font-size:1.4rem; margin:0 0 6px; } p { margin:0 0 18px; color:var(--muted); }
  label { font-weight:600; font-size:.92rem; display:block; margin-bottom:6px; }
  input[type=password] { width:100%; height:48px; border-radius:12px; border:1px solid var(--border); background:var(--bg); color:var(--text); padding:0 14px; font-size:1rem; }
  input[type=password]:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .row { display:flex; align-items:center; gap:8px; margin:12px 0 18px; font-size:.92rem; color:var(--muted); }
  button { width:100%; height:48px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-weight:700; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { color:var(--bad); font-weight:600; font-size:.92rem; min-height:1.4em; margin-top:12px; }
  .hint { margin-top:16px; font-size:.85rem; color:var(--muted); text-align:center; }
</style>

<script>
(function () {
  var P = JSON.parse(document.getElementById('payload').textContent);
  var KEY_STORE = 'mentorhub.key';
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function toB64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function open(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct)).then(function (buf) {
      var html = new TextDecoder().decode(buf);
      document.open(); document.write(html); document.close();
    });
  }
  function fromRaw(raw) { return crypto.subtle.importKey('raw', raw, 'AES-GCM', true, ['decrypt']); }
  function derive(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  var form = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  function showForm() { form.hidden = false; document.getElementById('pw').focus(); }
  if (!window.crypto || !crypto.subtle) { showForm(); err.textContent = 'Please open this site over https in an up-to-date browser.'; go.disabled = true; return; }

  // Already signed in on this device? (saved key is tied to this build's salt)
  var saved = null; try { saved = JSON.parse(localStorage.getItem(KEY_STORE) || sessionStorage.getItem(KEY_STORE) || 'null'); } catch (e) {}
  if (saved && saved.salt === P.salt) {
    fromRaw(b64(saved.key)).then(open).catch(function () { try { localStorage.removeItem(KEY_STORE); sessionStorage.removeItem(KEY_STORE); } catch (e) {} showForm(); });
  } else { showForm(); }

  form.addEventListener('submit', function (e) {
    e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Checking…';
    var key;
    derive(document.getElementById('pw').value).then(function (k) { key = k; return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, k, b64(P.ct)); })
      .then(function () { return crypto.subtle.exportKey('raw', key); })
      .then(function (raw) {
        var rec = JSON.stringify({ salt: P.salt, key: toB64(raw) });
        try { (document.getElementById('keep').checked ? localStorage : sessionStorage).setItem(KEY_STORE, rec); } catch (e) {}
        return open(key);
      })
      .catch(function () { go.disabled = false; go.textContent = 'Unlock'; err.textContent = 'That password is not right. Please try again.'; });
  });
})();
